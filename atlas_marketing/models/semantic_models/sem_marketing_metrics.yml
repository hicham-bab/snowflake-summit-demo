version: 2

metrics:
  - name: blended_roas
    description: Blended Return on Ad Spend — attributed revenue divided by total spend.
    label: "Blended ROAS"
    type: ratio
    numerator: total_attributed_revenue
    denominator: total_marketing_spend
  - name: cost_per_order
    description: Average marketing spend per attributed order.
    label: "Cost Per Order (CPO)"
    type: ratio
    numerator: total_marketing_spend
    denominator: total_attributed_orders