version: 2

sources:
  - name: marketing_raw
    description: >
      Raw marketing data in ATLAS_PLATFORM.RAW — generated by the platform team
      and consumed here by the marketing project. In dbt Mesh, each project defines
      its own source references even when the underlying tables are owned by another team.
    database: "{{ var('platform_database', 'ATLAS_PLATFORM') }}"
    schema: raw
    tables:
      - name: raw_ad_spend
        description: Daily ad spend records per campaign — generated by atlas_platform.
        tags: ["marketing", "raw"]
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: spend_id
            tests:
              - not_null
          - name: spend_date
            tests:
              - not_null
          - name: campaign_id
            tests:
              - not_null

      - name: raw_events
        description: Customer behavioral events — page views through purchases.
        tags: ["marketing", "raw"]
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: event_id
            tests:
              - not_null
