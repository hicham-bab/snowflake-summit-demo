name: atlas_platform
version: '1.0.0'
require-dbt-version: [">=1.9.0"]

dbt-cloud:
    project-id: 17339
profile: atlas_platform

flags:
  manage_state: true
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - target
  - dbt_packages

# Lake Compute: with DBT_USE_LAKE_COMPUTE=true (and DBT_ENGINE_EXPERIMENTAL_MULTI_ADAPTER=true)
# the project mixes engines in one DAG, writing into the Fivetran Managed Data Lake:
# - staging/ecommerce + staging/catalog run on Snowflake as Snowflake-managed Iceberg tables
# - int_orders_enriched + int_order_items_enriched run on Lake Compute (DuckDB on Iceberg)
# - int_customers_with_orders stays on Snowflake (APPROX_TOP_K, DATEADD, :: are Snowflake-only)
# - marts, the Semantic Layer and the consumer projects stay on Snowflake and read the lake back
# Unset (Production, dbt platform jobs): everything runs on Snowflake exactly as before.
# Lake Compute mode writes to *_LC schemas (see generate_schema_name) so it never touches prod tables.
models:
  +static_analysis: strict
  atlas_platform:
    +meta:
      engine: snowflake
    staging:
      +materialized: view
      catalog:
        +schema: staging_catalog
        +tags: ["staging", "catalog"]
        +materialized: "{{ 'table' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'view' }}"
        +table_format: "{{ 'iceberg' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'default' }}"
        +external_volume: "{{ 'SNOWFLAKE_MANAGED' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else none }}"
      ecommerce:
        +materialized: "{{ 'table' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'view' }}"
        +table_format: "{{ 'iceberg' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'default' }}"
        +external_volume: "{{ 'SNOWFLAKE_MANAGED' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else none }}"
        +schema: staging_ecommerce
        +tags: ["staging", "ecommerce"]
      marketing:
        +schema: staging_marketing
        +tags: ["staging", "marketing"]
    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate"]
      int_orders_enriched: &lake_compute
        +materialized: "{{ 'table' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'ephemeral' }}"
        +adapter: "{{ 'lakecompute' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else none }}"
        +schema: intermediate
        +meta:
          engine: "{{ 'lake_compute' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else 'snowflake' }}"
        +docs:
          node_color: "{{ '#FF694B' if env_var('DBT_USE_LAKE_COMPUTE', 'false') | lower == 'true' else none }}"
      int_order_items_enriched: *lake_compute
    marts:
      core:
        +materialized: table
        +schema: marts_core
        +tags: ["mart", "core", "published"]
      inventory:
        +materialized: table
        +schema: marts_inventory
        +tags: ["mart", "inventory"]
    # semantic_models/ contains MetricFlow YAML only — no materialization needed

seeds:
  atlas_platform:
    +schema: seeds

vars:
  start_date: '2026-06-01'
  end_date: '2027-06-15'
  platform_database: "{{ env_var('SNOWFLAKE_DATABASE', 'ATLAS_PLATFORM') }}"
