version: 2

sources:
  - name: ecommerce_raw
    description: >
      Raw e-commerce transactional data generated by Atlas Commerce's order management system.
      Data lands in the RAW schema via Fivetran connectors from the operational database.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'ATLAS_PLATFORM') }}"
    schema: raw

    # BUG #5 (for dbt Copilot demo): source freshness is not configured.
    # Copilot will flag this as a data observability gap and suggest adding
    # loaded_at_field + freshness thresholds on the raw_orders table.

    tables:
      - name: raw_orders
        description: One row per customer order. ~300K rows covering June 2025–June 2026.
        columns:
          - name: order_id
            description: Unique order identifier.
            tests:
              - unique
              - not_null
          - name: order_date
            description: Calendar date the order was placed.
          - name: customer_id
            description: FK to raw_customers.
          - name: store_id
            description: FK to catalog_stores seed (1–21).
          - name: status
            description: completed | cancelled | returned
          - name: discount_amount
            description: Total discount applied to the order. Null when no discount.
          - name: payment_method
            description: credit_card | debit_card | paypal | apple_pay | google_pay
          - name: campaign_id
            description: Attribution campaign. Null for non-attributed orders.
          - name: traffic_source
            description: paid_search | paid_social | organic | email | direct | affiliate | referral
          - name: item_count
            description: Number of distinct line items on the order.
          - name: ordered_at
            description: Full timestamp of order placement.

      - name: raw_order_items
        description: Line-item detail for each order — product, quantity, and price at time of purchase.
        columns:
          - name: order_item_id
            tests:
              - unique
              - not_null
          - name: order_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ecommerce_raw', 'raw_orders')
                    field: order_id

      - name: raw_customers
        description: Customer master records — 12,000 synthetic profiles with segments and acquisition metadata.
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null

      - name: raw_returns
        description: Return and refund records for orders with status = 'returned'.
        columns:
          - name: return_id
            tests:
              - unique
              - not_null
