version: 2

metrics:
  - name: discount_impact
    description: Discounts as a percentage of gross revenue — measures promotional pressure.
    label: "Discount Impact"
    type: ratio
    numerator: total_discounts
    denominator: finance_gross_revenue
  - name: refund_rate_pct
    description: Refunds as a percentage of gross revenue.
    label: "Refund Rate"
    type: ratio
    numerator: total_refunds
    denominator: finance_gross_revenue